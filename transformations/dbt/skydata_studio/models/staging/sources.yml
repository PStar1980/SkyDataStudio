version: 2

sources:
  - name: studio_curated
    description: Studio-owned curated tables materialized by the replay-safe pipeline engine.
    database: skydata_studio
    schema: mart
    tables:
      - name: fed_funds_rate
        description: Curated Federal Funds Effective Rate table proven in Phase 4.3.
        columns:
          - name: observation_date
            description: Business key for one daily observation.
            data_tests:
              - not_null
              - unique
          - name: rate
            description: Federal Funds Effective Rate as NUMERIC(10,4).
            data_tests:
              - not_null
