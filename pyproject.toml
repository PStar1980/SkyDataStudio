[project]
name = "skydata-studio"
version = "0.1.0"
description = "Data engineering workbench for transforming trusted ingested data into governed analytical products."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.128,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic>=2.13,<3.0",
  "pydantic-settings>=2.14,<3.0",
  "sqlalchemy>=2.0.50,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
  "httpx2>=2.10.0",
  "mypy>=1.17,<2.0",
  "pytest>=9.0,<10.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["apps/api", "packages/contracts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["apps/api", "packages/contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/skydata_studio", "packages/contracts/skydata_contracts"]
